name: Docker Build and Push

on:
    workflow_dispatch:
    push:
        branches: [ main, cinema ]
        paths:
            - "src/**"
            - "tests/postman/**"
            - "docker-compose.yml"
            - ".github/workflows/docker-build-push.yml"
    release:
        types: [ published ]

env:
    REGISTRY: ghcr.io

jobs:
    api-tests:
        name: Run API Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Start services with Docker Compose
              run: docker compose up -d --build

            - name: Wait for services to be ready
              run: sleep 30

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "18"
                cache: "npm"
                cache-dependency-path: tests/postman/package-lock.json

            - name: Install test dependencies
              working-directory: tests/postman
              run: npm ci

            - name: Run API tests
              working-directory: tests/postman
              run: npm run test:local

            - name: Stop services
              if: always()
              run: docker compose down -v

    build-and-push:
        name: Build and Push Images
        runs-on: ubuntu-latest
        needs: api-tests
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                include:
                    - service: monolith
                      context: ./src/monolith
                      image: ${{ github.repository }}/monolith
                    - service: movies-service
                      context: ./src/microservices/movies
                      image: ${{ github.repository }}/movies-service
                    - service: events-service
                      context: ./src/microservices/events
                      image: ${{ github.repository }}/events-service
                    - service: proxy-service
                      context: ./src/microservices/proxy
                      image: ${{ github.repository }}/proxy-service

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ matrix.image }}
                tags: |
                    type=ref,event=branch
                    type=sha,format=short
                    type=raw,value=latest

            - name: Build and push ${{ matrix.service }} Docker image
              uses: docker/build-push-action@v6
              with:
                context: ${{ matrix.context }}
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
